services:
  app:
    build:
      context: .
    environment:
      APP_ID: learn
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      DOCKER_ENV: "true"
      SESSION_SECRET: ${SESSION_SECRET}
      AI_PROVIDER_DEFAULT: cloudflare
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_D1_DATABASE_ID: ${CLOUDFLARE_D1_DATABASE_ID}
      CLOUDFLARE_D1_DATABASE_NAME: ${CLOUDFLARE_D1_DATABASE_NAME:-learn-db}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-learn-files}
      CLOUDFLARE_NEXT_CACHE_BUCKET: ${CLOUDFLARE_NEXT_CACHE_BUCKET:-learn-next-cache}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      CLOUDFLARE_AI_GATEWAY_ID: ${CLOUDFLARE_AI_GATEWAY_ID:-learn}
      CLOUDFLARE_AI_GATEWAY_TOKEN: ${CLOUDFLARE_AI_GATEWAY_TOKEN}
    ports:
      - "3000:3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.com}
      LEARN_DOMAIN: ${LEARN_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
