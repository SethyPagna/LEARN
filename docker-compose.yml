services:
  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://learning_os:learning_os_password@postgres:5432/learning_os
      DATABASE_SSL: "false"
      SESSION_SECRET: local-development-secret-change-before-production
      AI_PROVIDER_DEFAULT: ${AI_PROVIDER_DEFAULT:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      VERCEL_AI_GATEWAY: ${VERCEL_AI_GATEWAY:-}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: learning-os
      S3_ACCESS_KEY_ID: learning_os_minio
      S3_SECRET_ACCESS_KEY: learning_os_minio_password
    ports:
      - "3000:3000"
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: learning_os
      POSTGRES_USER: learning_os
      POSTGRES_PASSWORD: learning_os_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_os -d learning_os"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - learning_os_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - learning_os_redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: learning_os_minio
      MINIO_ROOT_PASSWORD: learning_os_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - learning_os_minio:/data

volumes:
  learning_os_postgres:
  learning_os_redis:
  learning_os_minio:
